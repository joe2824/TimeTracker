name: Docker

# Das Server-Abbild. Eigener Ablauf, nicht im Release-Job: der baut auf Windows
# fuer die Desktop-Anwendung, und ein Docker-Abbild gehoert auf einen Linux-Laeufer.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Zum Schreiben in die GitHub-Registry. Mehr braucht dieser Ablauf nicht.
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}-server

jobs:
  # Wie beim Release: ein rotes Testergebnis darf gar nicht erst zu einem Abbild
  # fuehren, das jemand auf seinen Server zieht.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run server:check
      - name: Server bauen (die Tests laufen gegen das Kompilat)
        run: npm run server:build
      - run: npm run server:test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fuer arm64: viele Heimserver sind Raspberry Pi oder ein ARM-Mini-PC.
      # better-sqlite3 ist eine native Erweiterung und wird je Architektur
      # uebersetzt - ohne diesen Schritt gaebe es nur ein x86-Abbild.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Marken bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` nur fuer stabile Versionen - eine Beta darf niemandem
          # unterschoben werden, der schlicht `:latest` zieht.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-beta') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Zwischenspeicher liegt in der Registry: ohne ihn uebersetzt jeder
          # Lauf better-sqlite3 fuer beide Architekturen neu, und das dauert.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
