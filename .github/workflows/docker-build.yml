name: Docker-Build

# Das Bauen und Veroeffentlichen des Server-Abbilds - einmal beschrieben,
# aufgerufen vom Release (neue Version) und vom woechentlichen Neubau
# (geflicktes Grundabbild, gleicher Quelltext).
on:
  workflow_call:
    inputs:
      tag:
        description: 'Welcher Versions-Tag gebaut wird, z. B. v0.9.3.'
        required: true
        type: string
      stable:
        description: 'Stabile Version? Nur die bekommt zusaetzlich die Marke `latest`.'
        required: true
        type: boolean
      image:
        description: 'Der Abbildname, komplett kleingeschrieben.'
        required: true
        type: string
    outputs:
      digest:
        description: 'Der Digest des veroeffentlichten Abbilds.'
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Zum Schreiben in die GitHub-Registry.
      packages: write
      # Fuer die Herkunftsbeglaubigung und cosign: beide holen sich ueber OIDC
      # ein kurzlebiges Zertifikat, statt einen Schluessel zu hinterlegen.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      # Gebaut wird der Stand des Tags, nicht der des Aufrufers: der
      # woechentliche Neubau laeuft auf einem Branch, und main enthaelt
      # unveroeffentlichten Quelltext.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      # Fuer arm64: viele Heimserver sind Raspberry Pi oder ein ARM-Mini-PC.
      # better-sqlite3 ist eine native Erweiterung und wird je Architektur
      # uebersetzt - ohne diesen Schritt gaebe es nur ein x86-Abbild.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Marken bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          # `value=` ist hier nicht schmueckendes Beiwerk: ohne die ausdrueckliche
          # Angabe liest `type=semver` die Version aus github.ref - und auf einem
          # Branch steht dort keine. Der geplante Lauf haette dann GAR keine
          # Marke, und `build-push-action` bricht ohne Marke ab.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.stable }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der ganze Zweck des woechentlichen Laufs. Ohne das bliebe das
          # Grundabbild aus dem Zwischenspeicher stehen, und der Neubau lieferte
          # denselben ungeflickten Unterbau noch einmal aus.
          pull: true
          # Stueckliste und Herkunft wandern als Anhaengsel mit in die Registry.
          # Damit laesst sich spaeter beantworten, was in einem laufenden
          # Container steckt, ohne ihn aufzumachen - und ob es von hier kommt.
          sbom: true
          provenance: mode=max
          # Der Zwischenspeicher liegt in der Registry: ohne ihn uebersetzt jeder
          # Lauf better-sqlite3 fuer beide Architekturen neu, und das dauert.
          # Aendert sich node:22-alpine nicht, faellt der woechentliche Lauf
          # dadurch auf denselben Digest zurueck und kostet fast nichts.
          cache-from: |
            type=gha
            type=registry,ref=${{ inputs.image }}:buildcache
          cache-to: type=gha,mode=max

      # Beglaubigung von GitHub selbst - nachpruefbar mit
      # `gh attestation verify oci://<abbild> --repo <repo>`.
      - name: Herkunft beglaubigen
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3

      # Signiert wird der Digest, nicht die Marke: `:latest` zeigt morgen
      # woanders hin, der Digest bleibt genau dieses Abbild. Die Unterschrift
      # deckt damit alle Marken ab, die auf ihn zeigen.
      - name: Abbild signieren
        env:
          ZIEL: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$ZIEL"

      - name: Zusammenfassung
        env:
          ZIEL: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
          MARKEN: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Abbild veroeffentlicht"
            echo
            echo '```'
            echo "$MARKEN"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "Pruefen:"
            echo '```bash'
            echo "cosign verify $ZIEL \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/\\.github/workflows/docker-build\\.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
