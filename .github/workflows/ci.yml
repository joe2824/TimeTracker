name: CI

# Bei jedem Push nach main und jedem PR. Was genau geprueft wird, steht in
# verify.yml - dasselbe Werk benutzt auch das Release, damit ein Tag nicht durch
# ein schwaecheres Gate geht als ein gewoehnlicher Push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ein zweiter Push auf denselben Branch macht den ersten Lauf gegenstandslos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
