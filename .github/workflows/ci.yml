name: CI

# Bei jedem Push und jedem PR. Vorher liefen die Tests nur, wenn jemand sie von
# Hand startete – ein Release ging raus, egal ob sie gruen waren.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Die Rust-Seite wurde bisher erst im Release-Build uebersetzt – ein Fehler in
  # src-tauri fiel also erst auf, wenn der Tag schon stand.
  #
  # Auf windows-latest und nicht ubuntu: der riskanteste Rust-Code der App steht
  # in #[cfg(windows)]-Bloecken (enforce_single_instance mit CreateMutexW/
  # FindWindowW, die Icon-Groessen ueber GetSystemMetrics). Ein Linux-Runner
  # schneidet genau die heraus und meldete gruen, ohne sie je gesehen zu haben.
  # Dazu kommt, dass Tauri auf ubuntu erst eine Reihe von webkit2gtk-Paketen
  # braucht – hier faellt der Schritt weg.
  #
  # Ohne `cargo fmt --check`: die Formatierung im Projekt ist von Hand gesetzt
  # (kurze Ketten bleiben einzeilig), rustfmt wuerde sie umbrechen wollen.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
