name: CI

# Bei jedem Push und jedem PR. Vorher liefen die Tests nur, wenn jemand sie von
# Hand startete – ein Release ging raus, egal ob sie gruen waren.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

      # Die Kontozeitzone haengt nicht an der des Geraets - das ist eine Zusage,
      # keine Vermutung. Geprueft wird sie, indem dieselbe Suite unter Zonen
      # laeuft, die weit weg liegen: +14, -11 und eine mit Viertelstunden-Versatz.
      # Die Kontozone bleibt dabei Berlin (siehe src/lib/testing/pinZone.ts), das
      # Ergebnis muss also unveraendert sein.
      - name: Tests in fremden Zeitzonen
        run: |
          for tz in Pacific/Kiritimati Pacific/Midway Australia/Eucla; do
            echo "--- $tz ---"
            TZ=$tz npm test
          done

      - name: Build
        run: npm run build

      # Der Server ist ein eigener Workspace mit eigenen Tests. Der Bau muss vor
      # den Tests laufen: der Durchstich in api.test.ts startet den GEBAUTEN
      # Server und spricht ihn ueber echtes HTTP an.
      # Die PWA aus derselben Quelle wie die Desktop-Anwendung. Bricht dieser
      # Schritt, ist etwas eingezogen, das nur in der Desktop-Huelle laeuft.
      - name: PWA bauen
        run: npm run build:web

      - name: Server pruefen
        run: npm run server:check

      # Der Bau MUSS vor den Server-Tests laufen: der Durchstich in api.test.ts
      # startet den gebauten Server und spricht ihn ueber echtes HTTP an.
      - name: Server bauen
        run: npm run server:build

      - name: Server-Tests
        run: npm run server:test

  # Die Rust-Seite wurde bisher erst im Release-Build uebersetzt – ein Fehler in
  # src-tauri fiel also erst auf, wenn der Tag schon stand.
  #
  # Auf windows-latest und nicht ubuntu: der riskanteste Rust-Code der App steht
  # in #[cfg(windows)]-Bloecken (enforce_single_instance mit CreateMutexW/
  # FindWindowW, die Icon-Groessen ueber GetSystemMetrics). Ein Linux-Runner
  # schneidet genau die heraus und meldete gruen, ohne sie je gesehen zu haben.
  # Dazu kommt, dass Tauri auf ubuntu erst eine Reihe von webkit2gtk-Paketen
  # braucht – hier faellt der Schritt weg.
  #
  # Ohne `cargo fmt --check`: die Formatierung im Projekt ist von Hand gesetzt
  # (kurze Ketten bleiben einzeilig), rustfmt wuerde sie umbrechen wollen.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
