name: Beta aus dev

# Manuell ausgeloest (kein Push-Trigger): hebt die Version auf die naechste
# Beta, committet das auf dev, taggt genau diesen Commit und startet release.yml
# fuer den Tag. Ausdruecklich per workflow_dispatch: ein Push mit GITHUB_TOKEN
# loest keine weiteren Workflows aus, der Tag allein baute also nichts.
#
# Die Version muss IN den Dateien stehen, nicht nur im Tag: der Build meldet
# sich mit der Version aus tauri.conf.json, und der Updater vergleicht genau die.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Basisversion der Beta-Serie (leer = laufende Serie fortsetzen bzw. Patch nach dem letzten stabilen Release)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Naechste Beta-Version bestimmen
        id: next
        shell: bash
        env:
          INPUT_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          # Aus den Tags, nicht aus package.json: nach einem stabilen Release auf
          # main steht dev noch auf der alten Beta - daraus wuerde eine Version,
          # die AELTER ist als das Release, und der Updater boete sie nie an.
          LAST_STABLE="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1)"
          LAST_STABLE="${LAST_STABLE:-0.0.0}"
          LAST_BETA_BASE="$(git tag -l 'v*-beta.*' | sed -E 's/^v([0-9.]+)-beta\..*$/\1/' | sort -V | tail -n1)"
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }
          if [[ -n "${INPUT_BASE}" ]]; then
            BASE="${INPUT_BASE}"
          elif [[ -n "${LAST_BETA_BASE}" ]] && newer "${LAST_BETA_BASE}" "${LAST_STABLE}"; then
            BASE="${LAST_BETA_BASE}"
          else
            IFS=. read -r MA MI PA <<< "${LAST_STABLE}"
            BASE="${MA}.${MI}.$((PA + 1))"
          fi
          if ! [[ "${BASE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Ungueltige Basisversion: ${BASE}" >&2
            exit 1
          fi
          if ! newer "${BASE}" "${LAST_STABLE}"; then
            echo "Basis ${BASE} liegt nicht ueber dem letzten Release ${LAST_STABLE}" >&2
            exit 1
          fi
          n=1
          while git rev-parse "v${BASE}-beta.${n}" >/dev/null 2>&1; do
            n=$((n + 1))
          done
          echo "version=${BASE}-beta.${n}" >> "$GITHUB_OUTPUT"

      - name: Version in allen Dateien setzen, committen und taggen
        shell: bash
        env:
          VERSION: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require("fs");
          const v = process.env.VERSION;
          const semver = String.raw`[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?`;
          const rewrite = (file, re, to) => {
            const before = fs.readFileSync(file, "utf8");
            const after = before.replace(re, to);
            if (after === before) throw new Error(`Keine Version gefunden in ${file}`);
            fs.writeFileSync(file, after);
          };
          for (const f of ["package.json", "server/package.json", "src-tauri/tauri.conf.json"]) {
            rewrite(f, new RegExp(`"version": "${semver}"`), `"version": "${v}"`);
          }
          rewrite("src-tauri/Cargo.toml", new RegExp(`^version = "${semver}"`, "m"), `version = "${v}"`);
          rewrite(
            "src-tauri/Cargo.lock",
            new RegExp(`(name = "timetracker"\\r?\\nversion = )"${semver}"`),
            `$1"${v}"`
          );
          JS

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json server/package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:dev
          git push origin "v${VERSION}"
          gh workflow run release.yml --ref "v${VERSION}"

          echo "### Beta getaggt" >> "$GITHUB_STEP_SUMMARY"
          echo "v${VERSION} (von dev, $(git rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
